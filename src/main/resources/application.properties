# server port, must match what the flutter app expects
server.port=8089

# datasource config, update username/password for your local mysql
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ctrcdb
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# jdbc connection pool basics
spring.datasource.hikari.maximum-pool-size=10

# photo uploads, the default cap is only 1MB which a phone camera goes past
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# show sql params in logs while developing, turn off later
logging.level.org.springframework.jdbc.core=debug

